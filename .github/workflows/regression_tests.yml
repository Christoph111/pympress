name: Regression tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-regressions:
    name: Linux regressions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run models and native-boundary callback regressions
        run: python -m unittest discover -s tests -v

  portable-models:
    name: Portable models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run file-reference, playback, and output controller tests
        run: python -m unittest tests.test_filelist.Files tests.test_playback tests.test_output -v

  localization:
    name: Localization and format placeholders
    runs-on: ubuntu-latest
    env:
      PYMPRESS_TEST_LOCALE_DIR: ${{ runner.temp }}/pympress-locales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the existing catalog tooling
        run: python -m pip install --disable-pip-version-check Babel==2.18.0
      - name: Check extracted catalogs and translation placeholders
        run: python scripts/check_i18n.py --compile-dir "$PYMPRESS_TEST_LOCALE_DIR"
      - name: Check translated callback templates and English fallback
        run: python -m unittest discover -s tests -p test_localization.py -v
